<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">CRAQ 链复制：写全链，读任意点</tspan></text> <rect x="40" y="70" width="90" height="50" rx="6" fill="#667eea"></rect><text x="85" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">客户端写</tspan></text> <text x="85" y="108" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">发到链头</tspan></text> <rect x="190" y="70" width="100" height="50" rx="6" fill="#0f3460"></rect><text x="240" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">节点 A</tspan></text> <text x="240" y="108" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">链头</tspan></text> <rect x="330" y="70" width="100" height="50" rx="6" fill="#0f3460"></rect><text x="380" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">节点 B</tspan></text> <text x="380" y="108" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">链中</tspan></text> <rect x="470" y="70" width="100" height="50" rx="6" fill="#0f3460"></rect><text x="520" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">节点 C</tspan></text> <text x="520" y="108" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">链尾</tspan></text> <line x1="130" y1="95" x2="190" y2="95" stroke="#999" stroke-width="1.5"></line><line x1="290" y1="95" x2="330" y2="95" stroke="#999" stroke-width="1.5"></line><line x1="430" y1="95" x2="470" y2="95" stroke="#999" stroke-width="1.5"></line><text x="380" y="60" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">写入沿链传播，全链确认才提交</tspan></text> <rect x="600" y="70" width="80" height="50" rx="6" fill="#27ae60"></rect><text x="640" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">客户端读</tspan></text> <text x="640" y="108" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">任意节点</tspan></text> <line x1="600" y1="115" x2="380" y2="125" stroke="#999" stroke-width="1.5"></line><rect x="40" y="155" width="640" height="105" rx="6" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="60" y="180" font-size="11" font-weight="bold" fill="#16213e"><tspan leaf="">读到未提交的脏版本怎么办：</tspan></text> <text x="60" y="202" font-size="11" fill="#333"><tspan leaf="">1. 节点返回特殊状态码，告诉客户端这个版本还没定稿</tspan></text> <text x="60" y="222" font-size="11" fill="#333"><tspan leaf="">2. 客户端转向链尾读取已提交版本，保证读到的一定是定稿</tspan></text> <text x="60" y="244" font-size="11" fill="#333"><tspan leaf="">3. 节点恢复时用整块替换写（full-chunk-replace）从上游补齐数据</tspan></text></svg>
