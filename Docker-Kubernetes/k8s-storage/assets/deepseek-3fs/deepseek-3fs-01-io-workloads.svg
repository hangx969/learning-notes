<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">AI 集群的三类 IO 负载</tspan></text> <rect x="20" y="45" width="210" height="30" rx="4" fill="#e94560"></rect><text x="125" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">checkpoint 写入</tspan></text> <rect x="20" y="75" width="210" height="120" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="125" y="100" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">周期性整体存盘</tspan></text> <text x="125" y="120" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">一次几百 GB 到几 TB</tspan></text> <text x="125" y="140" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">写慢了整个集群等</tspan></text> <text x="125" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#e94560"><tspan leaf="">要突发大带宽并行写</tspan></text> <rect x="245" y="45" width="210" height="30" rx="4" fill="#667eea"></rect><text x="350" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">训练数据读取</tspan></text> <rect x="245" y="75" width="210" height="120" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="350" y="100" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">PB 级数据集随机抽样</tspan></text> <text x="350" y="120" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">高并发随机读</tspan></text> <text x="350" y="140" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">GPU 不能等数据</tspan></text> <text x="350" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#667eea"><tspan leaf="">要高吞吐加低延迟读</tspan></text> <rect x="470" y="45" width="210" height="30" rx="4" fill="#764ba2"></rect><text x="575" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff"><tspan leaf="">KVCache 外置</tspan></text> <rect x="470" y="75" width="210" height="120" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="575" y="100" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">显存放不下就换出</tspan></text> <text x="575" y="120" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">用时再高速换回</tspan></text> <text x="575" y="140" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">决定推理并发上限</tspan></text> <text x="575" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#764ba2"><tspan leaf="">要持续大吞吐读</tspan></text> <rect x="20" y="220" width="660" height="56" rx="4" fill="#16213e"></rect><text x="350" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">三类负载都不大但都很极端：要么突发写，要么随机读，要么持续读</tspan></text> <text x="350" y="264" text-anchor="middle" font-size="11" fill="#cfd8e3"><tspan leaf="">为通用场景设计的存储，没有一个能同时接住这三样</tspan></text></svg>
