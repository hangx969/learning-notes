<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">并行文件系统的三代</tspan></text> <line x1="60" y1="70" x2="640" y2="70" stroke="#999" stroke-width="2"></line><circle cx="100" cy="70" r="6" fill="#764ba2"></circle><circle cx="280" cy="70" r="6" fill="#667eea"></circle><circle cx="560" cy="70" r="8" fill="#e94560"></circle><text x="100" y="56" text-anchor="middle" font-size="10" fill="#888"><tspan leaf="">1999 / 2004</tspan></text> <text x="280" y="56" text-anchor="middle" font-size="10" fill="#888"><tspan leaf="">2019</tspan></text> <text x="560" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="#e94560"><tspan leaf="">2025</tspan></text> <rect x="40" y="90" width="130" height="84" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="105" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#16213e"><tspan leaf="">Lustre / BeeGFS</tspan></text> <text x="105" y="132" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">HDD 时代设计</tspan></text> <text x="105" y="150" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">内核客户端</tspan></text> <text x="105" y="168" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">全闪时代打补丁</tspan></text> <rect x="215" y="90" width="130" height="84" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="280" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#16213e"><tspan leaf="">DAOS</tspan></text> <text x="280" y="132" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">第一次为新介质重写</tspan></text> <text x="280" y="150" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">用户态 + RDMA</tspan></text> <text x="280" y="168" text-anchor="middle"