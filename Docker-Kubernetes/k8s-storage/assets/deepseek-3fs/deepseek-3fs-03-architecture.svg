<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">3FS 总体架构</tspan></text> <rect x="40" y="42" width="280" height="118" rx="6" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="180" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">客户端（计算节点）</tspan></text> <rect x="56" y="74" width="118" height="34" rx="4" fill="#667eea"></rect><text x="115" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">原生客户端</tspan></text> <rect x="186" y="74" width="118" height="34" rx="4" fill="#999"></rect><text x="245" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">FUSE 客户端</tspan></text> <text x="180" y="128" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">USRBIO 接口走用户态，FUSE 走内核兼容</tspan></text> <text x="180" y="144" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">性能路径与兼容路径分开</tspan></text> <rect x="380" y="42" width="280" height="118" rx="6" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="520" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">管理服务 mgmt</tspan></text> <text x="520" y="92" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">节点注册与发现</tspan></text> <text x="520" y="112" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">配置分发，集群状态</tspan></text> <line x1="320" y1="100" x2="380" y2="100" stroke="#999" stroke-width="1.5"></line><rect x="40" y="190" width="280" height="130" rx="6" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="180" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">元数据服务（无状态）</tspan></text> <rect x="70" y="222" width="220" height="30" rx="4" fill="#764ba2"></rect><text x="180" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">FoundationDB 事务 KV</tspan></text> <text x="180" y="272" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">目录、权限、chunk 位置全部存成 KV</tspan></text> <text x="180" y="290" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">服务本身无状态，水平扩展直接加实例</tspan></text> <rect x="380" y="190" width="280" height="130" rx="6" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="520" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">存储服务（180 节点）</tspan></text> <rect x="398" y="222" width="72" height="30" rx="4" fill="#0f3460"></rect><text x="434" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff"><tspan leaf="">NVMe×16</tspan></text> <rect x="480" y="222" width="80" height="30" rx="4" fill="#0f3460"></rect><text x="520" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff"><tspan leaf="">链复制</tspan></text> <rect x="570" y="222" width="76" height="30" rx="4" fill="#0f3460"></rect><text x="608" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff"><tspan leaf="">2×200G IB</tspan></text> <text x="520" y="272" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">共 2880 块 NVMe SSD</tspan></text> <text x="520" y="290" text-anchor="middle" font-size="10" fill="#555"><tspan leaf="">有效容量 20 PiB 以上（含副本）</tspan></text> <line x1="180" y1="160" x2="180" y2="190" stroke="#999" stroke-width="1.5"></line><line x1="520" y1="160" x2="520" y2="190" stroke="#999" stroke-width="1.5"></line><line x1="320" y1="255" x2="380" y2="255" stroke="#999" stroke-width="1.5"></line><text x="350" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">数据面：客户端 RDMA 直连存储节点，元数据只在建连和定位时参与</tspan></text> <text x="350" y="382" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">元数据查完就退场，大吞吐不走元数据服务</tspan></text></svg>
