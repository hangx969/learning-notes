<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">KVCache 的多级放置</tspan></text> <rect x="60" y="55" width="180" height="44" rx="4" fill="#e94560"></rect><text x="150" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">GPU 显存</tspan></text> <text x="150" y="91" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">热数据，最贵最小</tspan></text> <line x1="240" y1="77" x2="270" y2="77" stroke="#999" stroke-width="1.5"></line><rect x="270" y="55" width="180" height="44" rx="4" fill="#667eea"></rect><text x="360" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">CPU 内存</tspan></text> <text x="360" y="91" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">温数据，中等</tspan></text> <line x1="450" y1="77" x2="480" y2="77" stroke="#999" stroke-width="1.5"></line><rect x="480" y="55" width="180" height="44" rx="4" fill="#0f3460"></rect><text x="570" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">3FS 磁盘层</tspan></text> <text x="570" y="91" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">冷数据，便宜量大</tspan></text> <text x="350" y="130" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">不活跃的 KVCache 逐级换出，命中时高速换回</tspan></text> <rect x="60" y="155" width="600" height="110" rx="6" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="80" y="182" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">社区的推理框架对接（据公开报道）</tspan></text> <text x="80" y="206" font-size="11" fill="#333"><tspan leaf="">Mooncake（月之暗面 Kimi 的推理服务平台）：实验性 3FS USRBIO 适配器，把 3FS 当磁盘层</tspan></text> <text x="80" y="228" font-size="11" fill="#333"><tspan leaf="">LMCache（KVCache 管理组件）：存储后端列表包含 3FS</tspan></text> <text x="80" y="250" font-size="11" fill="#333"><tspan leaf="">vLLM / SGLang 的使用者经由 Mooncake 等多级缓存间接接上 3FS</tspan></text></svg>
