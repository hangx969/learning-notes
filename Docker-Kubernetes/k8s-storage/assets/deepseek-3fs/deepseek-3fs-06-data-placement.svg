<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">数据放置：从文件到盘</tspan></text> <rect x="30" y="60" width="110" height="44" rx="4" fill="#667eea"></rect><text x="85" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">文件</tspan></text> <line x1="140" y1="82" x2="170" y2="82" stroke="#999" stroke-width="1.5"></line><rect x="170" y="60" width="110" height="44" rx="4" fill="#764ba2"></rect><text x="225" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">chunk 切片</tspan></text> <text x="225" y="96" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">固定大小</tspan></text> <line x1="280" y1="82" x2="310" y2="82" stroke="#999" stroke-width="1.5"></line><rect x="310" y="60" width="110" height="44" rx="4" fill="#0f3460"></rect><text x="365" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">chain 复制链</tspan></text> <text x="365" y="96" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">多节点副本</tspan></text> <line x1="420" y1="82" x2="450" y2="82" stroke="#999" stroke-width="1.5"></line><rect x="450" y="60" width="120" height="44" rx="4" fill="#27ae60"></rect><text x="510" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">target 分布</tspan></text> <text x="510" y="96" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">每盘多个 target</tspan></text> <line x1="570" y1="82" x2="595" y2="82" stroke="#999" stroke-width="1.5"></line><rect x="595" y="60" width="80" height="44" rx="4" fill="#999"></rect><text x="635" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff"><tspan leaf="">NVMe 盘</tspan></text> <rect x="30" y="140" width="645" height="90" rx="6" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="352" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">平衡不完全区组设计（组合数学）</tspan></text> <text x="352" y="190" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">任意一块盘故障时，重建流量均匀摊到所有剩余盘</tspan></text> <text x="352" y="212" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">避免个别盘被重建流量打满，缩短恢复窗口</tspan></text></svg>
