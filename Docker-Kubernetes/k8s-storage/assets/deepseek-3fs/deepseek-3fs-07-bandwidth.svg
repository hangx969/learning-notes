<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">带宽怎么堆到 6.6 TiB/s</tspan></text> <rect x="60" y="55" width="580" height="40" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="80" y="80" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">单块 NVMe SSD</tspan></text> <text x="620" y="80" text-anchor="end" font-size="12" fill="#555"><tspan leaf="">顺序读约几 GB/s</tspan></text> <rect x="60" y="105" width="580" height="40" rx="4" fill="#667eea"></rect><text x="80" y="130" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">单个存储节点：16 块盘 + 2×200Gbps 网卡</tspan></text> <text x="620" y="130" text-anchor="end" font-size="12" fill="#fff"><tspan leaf="">聚合约 50 GB/s</tspan></text> <rect x="60" y="155" width="580" height="40" rx="4" fill="#0f3460"></rect><text x="80" y="180" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">180 个存储节点并行</tspan></text> <text x="620" y="180" text-anchor="end" font-size="12" fill="#fff"><tspan leaf="">官方宣称约 6.6 TiB/s</tspan></text> <text x="350" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#16213e"><tspan leaf="">前提：盘、网卡、客户端三边的带宽配比是算好的</tspan></text> <text x="350" y="249" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">单盘带宽 × 16 ≈ 两块 200Gbps 网卡的有效带宽，谁都不是瓶颈</tspan></text> <text x="350" y="273" text-anchor="middle" font-size="11" fill="#555"><tspan leaf="">500 多个客户端各配 200Gbps 网卡，读侧带宽同样配平</tspan></text> <text x="350" y="297" text-anchor="middle" font-size="11" fill="#e94560"><tspan leaf="">这是配方，不是魔法：换一组硬件配比，数字就不成立</tspan></text></svg>
