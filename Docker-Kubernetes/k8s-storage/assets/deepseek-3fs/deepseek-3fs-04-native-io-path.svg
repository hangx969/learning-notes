<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" style="width: 100%; height: auto; display: block; font-family: &quot;PingFang SC&quot;, -apple-system, BlinkMacSystemFont, &quot;Microsoft YaHei&quot;, sans-serif;" role="img" aria-label="插图"><text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e"><tspan leaf="">原生客户端的数据路径</tspan></text> <rect x="30" y="55" width="140" height="70" rx="6" fill="#667eea"></rect><text x="100" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">应用进程</tspan></text> <text x="100" y="103" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">注册共享内存</tspan></text> <rect x="200" y="55" width="140" height="70" rx="6" fill="#0f3460"></rect><text x="270" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">USRBIO 环队列</tspan></text> <text x="270" y="103" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">用户态提交 IO</tspan></text> <rect x="370" y="55" width="140" height="70" rx="6" fill="#764ba2"></rect><text x="440" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">RDMA 传输</tspan></text> <text x="440" y="103" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">绕过 TCP/IP 协议栈</tspan></text> <rect x="540" y="55" width="140" height="70" rx="6" fill="#27ae60"></rect><text x="610" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff"><tspan leaf="">存储节点</tspan></text> <text x="610" y="103" text-anchor="middle" font-size="10" fill="#fff"><tspan leaf="">用户态异步 IO</tspan></text> <line x1="170" y1="90" x2="200" y2="90" stroke="#999" stroke-width="1.5"></line><line x1="340" y1="90" x2="370" y2="90" stroke="#999" stroke-width="1.5"></line><line x1="510" y1="90" x2="540" y2="90" stroke="#999" stroke-width="1.5"></line><rect x="560" y="145" width="100" height="26" rx="4" fill="#f8f9fa" stroke="#dee2e6"></rect><text x="610" y="163" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">NVMe SSD 阵列</tspan></text> <line x1="610" y1="125" x2="610" y2="145" stroke="#999" stroke-width="1.5"></line><rect x="30" y="200" width="650" height="72" rx="6" fill="#f0f4ff" stroke="#4A6CF7"></rect><text x="350" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f3460"><tspan leaf="">全程不经过内核文件系统，没有内核态拷贝</tspan></text> <text x="350" y="250" text-anchor="middle" font-size="11" fill="#333"><tspan leaf="">FUSE 路径每秒约 40 万个 4KiB 读（约 1.6 GB/s），仅作兼容用途</tspan></text></svg>
